<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom Domestic — Private</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#070E1C;--panel:#101F38;--line:#22365A;--text:#F2F5FA;--muted:#93A3BC;--orange:#FF7A1A;--gold:#FFC53D}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(900px 480px at 10% -10%,rgba(59,155,255,.22),transparent 60%),radial-gradient(700px 420px at 95% 10%,rgba(255,122,26,.2),transparent 60%),var(--bg);color:var(--text);font-family:"IBM Plex Sans",system-ui,sans-serif;padding:24px}
  .box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px}
  .brand{font-family:Sora,system-ui,sans-serif;font-weight:700;font-size:20px;display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .brand i{width:10px;height:10px;background:var(--orange);border-radius:2px;transform:rotate(45deg)}
  p{color:var(--muted);margin:0 0 22px;font-size:15px}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
  input{width:100%;font:17px "IBM Plex Sans",system-ui,sans-serif;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#0C172B;color:var(--text);outline:none}
  input:focus{border-color:var(--orange)}
  button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--orange);color:#1a0d00;font:600 16px Sora,system-ui,sans-serif;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:var(--gold);font-size:14px;margin-top:12px;min-height:20px}
</style></head>
<body>
<div class="box">
  <div class="brand"><i></i>Axiom Domestic</div>
  <p>This page is private. Enter the password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password" autofocus>
  <button id="go">Open</button>
  <div class="err" id="err"></div>
</div>

    var enc=new TextEncoder();
